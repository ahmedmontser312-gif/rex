name: Build C++ Binary

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Source Code
      run: |
        echo "Searching and compiling source files..."
        # هذا الأمر يبحث عن كل ملفات الـ cpp في المجلدات ويقوم بتجميعها مع ربط مكتبات النظام المطلوبة
        cl.exe /EHsc /O2 /I"include" /I"src" src/*.cpp libs/*.cpp /Fe:elevator.exe /link crypt32.lib netapi32.lib
        
    - name: Upload Built Binary
      uses: actions/upload-artifact@v4
      with:
        name: elevator-binary
        path: elevator.exe
