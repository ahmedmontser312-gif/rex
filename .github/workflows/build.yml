name: Build C++ Binary

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile All Project Files
      run: |
        echo "Compiling all source files from subfolders..."
        cl.exe /EHsc /O2 src/*.cpp libs/sqlite/*.cpp /Fe:elevator.exe /link crypt32.netapi32.lib
        
    - name: Upload Built Binary
      uses: actions/upload-artifact@v4
      with:
        name: elevator-binary
        path: elevator.exe
